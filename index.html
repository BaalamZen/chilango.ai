<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chilango.ai — Coming Soon</title>
  <meta name="description" content="chilango.ai — La curiosidad vive aquí. Hecho en México." />

  <!-- Open Graph / social preview -->
  <meta property="og:title" content="chilango.ai" />
  <meta property="og:description" content="La curiosidad vive aquí. Hecho en México. Impulsado por la posibilidad." />
  <meta property="og:image" content="logo.png" />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/png" href="logo.png" />

  <style>
    :root {
      --bg-deep: #0a2a2e;
      --bg-mid: #103e44;
      --accent: #f25c54;
      --text: #0a2a2e;
      --muted: #14545b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      text-align: center;
      padding: 2rem;
      background: #ffffff;
      overflow: hidden;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 680px;
      animation: rise 0.9s ease-out both;
    }

    .logo {
      width: clamp(360px, 84vw, 560px);
      height: auto;
      filter: drop-shadow(0 12px 40px rgba(0, 0, 0, 0.12));
    }

    h1 {
      margin-top: 2rem;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    p {
      margin-top: 1.1rem;
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      font-weight: 600;
      color: var(--muted);
      line-height: 1.5;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 3px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    .tag {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.7;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%           { transform: scale(1);   opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wrap, .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="logo.png" alt="chilango.ai logo" />
    <h1>La curiosidad vive aquí.</h1>
    <p>
      Hecho en México. Impulsado por la posibilidad.
      <br />
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </p>
    <div class="tag">chilango.ai</div>
  </main>
</body>
</html>
